name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The transcode tests drive the real binary, because a mocked child process would pass with
      # any arguments at all — and these arguments have been wrong twice. ubuntu-latest stopped
      # shipping ffmpeg, so install it explicitly.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - name: Prepare synthetic search assets for prerendering
        run: bun run scripts/prepare-ci-search.ts
      - run: bun run build

  deploy-trigger:
    # Scheduled jobs record the identity written here; the site deploy refuses any other source.
    # Forks have no TRIGGER_ACCESS_TOKEN, so this job does nothing there.
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: trigger-production
      cancel-in-progress: false
    env:
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
    steps:
      - name: Check for a Trigger.dev token
        id: configured
        run: echo "enabled=${{ env.TRIGGER_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.configured.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.configured.outputs.enabled == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - if: steps.configured.outputs.enabled == 'true'
        run: bun install --frozen-lockfile
      - name: Record source identity
        if: steps.configured.outputs.enabled == 'true'
        run: bun run hosted identity
      - name: Deploy Trigger.dev tasks
        if: steps.configured.outputs.enabled == 'true'
        run: bunx trigger.dev@4.7.3 deploy --external-id "$GITHUB_SHA"
