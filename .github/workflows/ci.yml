name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The transcode tests drive the real binary, because a mocked child process would pass with
      # any arguments at all — and these arguments have been wrong twice. ubuntu-latest stopped
      # shipping ffmpeg, so install it explicitly.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - name: Prepare synthetic search assets for prerendering
        run: bun run scripts/prepare-ci-search.ts
      - run: bun run build

  deploy-trigger:
    # Scheduled jobs record the identity written here; the site deploy refuses any other source.
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: trigger-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Record source identity
        run: bun run hosted identity
      - name: Deploy Trigger.dev tasks
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: bunx trigger.dev@4.7.3 deploy --external-id "$GITHUB_SHA"
